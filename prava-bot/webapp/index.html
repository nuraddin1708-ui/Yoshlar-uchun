<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yo'l qoidasi | Biz bilan osonroq</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f6fb); --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b2333); --muted: var(--tg-theme-hint-color, #6b7486);
    --primary: var(--tg-theme-button-color, #1f5eff); --ptext: var(--tg-theme-button-text-color, #fff);
    --ok: #1a9c55; --bad: #d93a3a; --border: rgba(128,128,128,.25);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 24px; margin: 6px 0; } h2 { font-size: 18px; line-height: 1.35; margin: 10px 0 14px; }
  .slogan { margin: -4px 0 10px; color: var(--hint, #8a94a6); font-weight: 600; letter-spacing: .3px; }
  p { color: var(--muted); line-height: 1.5; margin: 6px 0; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; background: var(--primary); color: var(--ptext); margin-top: 10px; }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .tile { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 16px; margin-top: 10px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .tile .ic { font-size: 32px; } .tile b { display: block; font-size: 17px; } .tile span { color: var(--muted); font-size: 14px; }
  .opt { display: block; width: 100%; text-align: left; padding: 13px 15px; margin: 8px 0; background: var(--card);
    color: var(--text); border: 1.5px solid var(--border); font-size: 16px; line-height: 1.4; }
  .opt.ok { border-color: var(--ok); background: rgba(26,156,85,.14); }
  .opt.bad { border-color: var(--bad); background: rgba(217,58,58,.14); }
  .top { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; margin: 8px 0 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--primary); }
  .sign { display: flex; justify-content: center; } .sign svg { width: 110px; height: 110px; }
  .alif { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin: 4px 0 2px; }
  .alif button { padding: 5px 9px; border-radius: 8px; background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 13px; }
  .alif button.on { background: var(--primary); color: var(--ptext); border-color: var(--primary); }
  .qimg { display: flex; justify-content: center; gap: 12px; margin: 6px 0 2px; flex-wrap: wrap; }
  .qimg svg { width: 112px; height: 112px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .opt.withimg { display: flex; align-items: center; gap: 10px; }
  .oimg svg { width: 48px; height: 48px; flex: none; display: block; }
  .anim { margin: 8px 0 4px; } .anim svg { width: 100%; height: auto; display: block; border-radius: 10px; }
  /* 3D vaziyatlar */
  #vz { position: fixed; inset: 0; display: none; background: #bfdcf2; z-index: 5; }
  #vzcv { display: block; }
  #vzL .vzlab { position: absolute; transform: translate(-50%, -100%); background: rgba(255,255,255,.92); color: #111; font: 700 12px/1.2 system-ui, sans-serif;
    padding: 4px 8px; border-radius: 99px; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  #vzL .vzlab.first { background: #22c55e; color: #fff; } #vzL .vzlab.wait { background: #ef4444; color: #fff; }
  #vzQ { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(92%, 520px); text-align: center; pointer-events: none; }
  .vzh { font: 900 26px/1.1 system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 #c62828, 0 3px 8px rgba(0,0,0,.6); letter-spacing: .5px; }
  .vzsub { color: #fff; font-weight: 700; text-shadow: 0 1px 4px #000; margin-top: 4px; }
  .vzcard { position: relative; margin-top: 8px; background: #fff; color: #111; border-radius: 14px; padding: 12px 40px 12px 14px; font-weight: 700; font-size: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .vzt { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; border: 3px solid #1d4ed8; color: #1d4ed8; display: grid; place-items: center; font-weight: 900; }
  #vzO { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(92%, 520px); display: flex; flex-direction: column; gap: 8px; }
  #vzO button { display: flex; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 12px; background: #fff; color: #111; font-weight: 700; font-size: 15px; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
  #vzO button b { width: 24px; height: 24px; flex: none; border-radius: 50%; background: #1d4ed8; color: #fff; display: grid; place-items: center; font-size: 13px; }
  #vzO button.good { background: #22c55e; color: #fff; } #vzO button.bad { background: #ef4444; color: #fff; } #vzO button.dim { opacity: .45; }
  #vzO button.wide { justify-content: center; background: #1d4ed8; color: #fff; }
  #vzF { position: absolute; top: 74%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: .25s; font: 900 30px system-ui, sans-serif; color: #fff;
    background: rgba(220,38,38,.92); padding: 14px 20px; border-radius: 16px; text-align: center; max-width: 88%; pointer-events: none; }
  #vzF.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #vzR { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(94%, 560px); max-height: 62%; overflow: auto; display: none;
    background: var(--bg, #fff); color: var(--text, #111); border-radius: 16px; padding: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .vzres { font-weight: 800; font-size: 17px; } .vzres.ok { color: #16a34a; } .vzres.no { color: #dc2626; }
  .vzbtns { display: grid; gap: 6px; } .vzbtns .btn { margin-top: 4px; }
  #vz .exit { top: 10px; right: 10px; padding: 6px 12px; }
  .quote { margin: 8px 0 4px; padding: 8px 10px; border-left: 3px solid var(--primary); background: rgba(127,127,127,.08); border-radius: 6px; font-size: 14px; font-style: italic; }
  .explain { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--card); font-size: 15px; line-height: 1.5; }
  .big { font-size: 44px; font-weight: 800; text-align: center; margin: 6px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .stat { background: var(--card); border-radius: 12px; padding: 12px; text-align: center; font-size: 14px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; color: var(--text); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 13px; background: rgba(26,156,85,.15); color: var(--ok); }
  /* avtodrom */
  #game { position: fixed; inset: 0; background: #2e7d32; display: none; touch-action: none; user-select: none; }
  #cv { display: block; }
  .cam { position: absolute; top: 36px; left: 8px; background: rgba(0,0,0,.5); color: #fff; padding: 6px 10px; font-size: 16px; }
  .hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; color: #fff;
    font-weight: 700; text-shadow: 0 1px 3px #000; font-size: 15px; pointer-events: none; }
  .msg { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.65); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 14px; width: max-content; max-width: 86%; text-align: center; display: none; }
  /* boshqaruv: rul, pedallar, uzatma, povorotnik */
  .ctlb { position: absolute; background: rgba(20,22,26,.55); color: #fff; border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(3px); }
  .exit { top: 34px; right: 8px; padding: 6px 10px; font-size: 13px; }
  .cam { top: 34px; left: 8px; padding: 6px 10px; font-size: 16px; }
  #bSnd { top: 34px; left: 56px; padding: 6px 10px; font-size: 16px; }
  #wheelBox { position: absolute; left: 10px; bottom: 10px; width: min(40vh, 34vw); height: min(40vh, 34vw); touch-action: none; }
  #wheel { width: 100%; height: 100%; will-change: transform; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  .sigs { position: absolute; left: 10px; bottom: calc(min(40vh, 34vw) + 16px); display: flex; gap: 8px; }
  .sigs button { width: 46px; height: 40px; font-size: 20px; border-radius: 10px; }
  .sigs button.on { background: #2e7d32; border-color: #9cff9c; }
  #gearbox { position: absolute; right: calc(min(13vw, 120px) + min(9vw, 80px) + 26px); bottom: 12px; display: flex; flex-direction: column; gap: 4px;
    background: rgba(20,22,26,.6); padding: 6px; border-radius: 12px; }
  #gearbox button { width: 40px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.12); color: #ddd; font-weight: 800; font-size: 16px; }
  #gearbox button.on { background: #ffd54f; color: #222; }
  .pedal { position: absolute; bottom: 12px; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
    color: #eee; font-size: 12px; font-weight: 800; letter-spacing: .5px; touch-action: none;
    background: repeating-linear-gradient(0deg, #3a3d42 0 8px, #2b2e33 8px 14px); border: 2px solid #5b6068; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  #pBrake { right: calc(min(9vw, 80px) + 18px); width: min(13vw, 120px); height: min(24vh, 140px); }
  #pGas { right: 10px; width: min(9vw, 80px); height: min(34vh, 200px); }
  .pedal.on { border-color: #ffd54f; transform: scaleY(.96); transform-origin: bottom; }
  #dash { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    background: linear-gradient(#1b1d21, #0d0e10); border: 1px solid #333; border-radius: 16px 16px 10px 10px; padding: 4px 12px; color: #ddd; pointer-events: none; }
  #dash > svg { width: min(18vh, 120px); height: min(18vh, 120px); }
  .tl { font-size: 22px; opacity: .18; } .tl.on { opacity: 1; }
  #tlL.on, #tlR.on { color: #34e36a; text-shadow: 0 0 8px #34e36a; } #tlB.on { color: #ff5252; }
  #tlS { display: inline-block; vertical-align: middle; } #tlS.on { color: #ff3b30; filter: drop-shadow(0 0 4px #ff3b30); }
  #bBelt { color: #fff; display: flex; align-items: center; justify-content: center; }
  #bBelt.on { background: #2e7d32; border-color: #9cff9c; } #bBelt:not(.on) { background: rgba(200,40,40,.7); }
  #gearInd { font-size: 26px; font-weight: 900; color: #ffd54f; min-width: 22px; text-align: center; }
  @media (orientation: portrait) { #dash { bottom: auto; top: 60px; } }
  #game.cabin .msg { top: calc(min(30vw, 360px) / 3.2 + 30px); max-width: 56%; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="vz">
  <canvas id="vzcv"></canvas>
  <div id="vzL"></div>
  <div id="vzQ"></div>
  <div id="vzF"></div>
  <div id="vzO"></div>
  <div id="vzC"></div>
  <div id="vzR"></div>
  <button class="ctlb exit" onclick="Vz.close()">✕</button>
</div>

<div id="game">
  <canvas id="cv"></canvas>
  <div class="hud"><span id="hTime">⏱ 0.0</span><span id="hStep">1/12</span><span id="hPen">Xato: 0/3</span></div>
  <div class="msg" id="hMsg"></div>
  <button class="ctlb exit" onclick="Drive.stop(true)">✕ Chiqish</button>
  <button class="ctlb cam" onclick="Drive.toggleCam()" title="Kamera">🎥</button>
  <button class="ctlb" id="bSnd" onclick="Drive.toggleSound()" title="Ovoz">🔊</button>
  <div id="dash">
    <span class="tl" id="tlL">⬅</span>
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#111" stroke="#444" stroke-width="3"/>
      <g id="ticks"></g><text x="60" y="88" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" id="spd">0</text>
      <text x="60" y="102" fill="#888" font-size="9" text-anchor="middle">km/soat</text>
      <line id="needle" x1="60" y1="60" x2="60" y2="14" stroke="#ff3b30" stroke-width="3" stroke-linecap="round" transform="rotate(-120 60 60)"/>
      <circle cx="60" cy="60" r="5" fill="#ddd"/></svg>
    <div><div id="gearInd">P</div><span class="tl" id="tlB" title="Tormoz">⓿</span><span class="tl" id="tlS" title="Kamar taqilmagan"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="4.2" r="2.7" fill="currentColor"/><path d="M6.5 9.5Q12 7.5 17.5 9.5L16.5 18H7.5Z" fill="currentColor"/><path d="M8 8.6L15.6 17.6" stroke="#111" stroke-width="2"/><rect x="5" y="19" width="14" height="2.4" rx="1" fill="currentColor"/></svg></span></div>
    <span class="tl" id="tlR">➡</span>
  </div>
  <div class="sigs"><button class="ctlb" style="position:static" id="bSigL" onclick="Drive.signal('L')">⬅</button>
    <button class="ctlb" style="position:static" id="bHorn">📯</button>
    <button class="ctlb" style="position:static" id="bBelt" onclick="Drive.belt()"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="4.2" r="2.7" fill="currentColor"/><path d="M6.5 9.5Q12 7.5 17.5 9.5L16.5 18H7.5Z" fill="currentColor"/><path d="M8 8.6L15.6 17.6" stroke="#111" stroke-width="2"/><rect x="5" y="19" width="14" height="2.4" rx="1" fill="currentColor"/></svg></button>
    <button class="ctlb" style="position:static" id="bSigR" onclick="Drive.signal('R')">➡</button></div>
  <div id="wheelBox"><svg id="wheel" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="88" fill="none" stroke="#1d1f23" stroke-width="20"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#3b3f46" stroke-width="3" stroke-dasharray="6 10"/>
    <rect x="94" y="10" width="12" height="20" rx="3" fill="#ffd54f"/>
    <path d="M22 108 Q100 128 178 108 L178 120 Q100 140 22 120 Z" fill="#2a2d33"/>
    <path d="M88 120 L80 182 L120 182 L112 120 Z" fill="#2a2d33"/>
    <circle cx="100" cy="112" r="30" fill="#24272c" stroke="#555" stroke-width="2"/>
    <text x="100" y="117" fill="#999" font-size="12" font-weight="700" text-anchor="middle">YQ</text></svg></div>
  <div id="gearbox"><button data-g="P">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button></div>
  <div class="pedal" id="pBrake">TORMOZ</div>
  <div class="pedal" id="pGas">GAZ</div>
</div>

<script src="belgilar.js"></script>
<script src="animatsiya.js"></script>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const DEV = new URLSearchParams(location.search).has("dev");
const INIT = DEV ? "dev" : (tg && tg.initData) || "";
const app = document.getElementById("app");
let ME = null, QS = [], TOTAL = 0;

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Init-Data": INIT, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  if (!INIT) { app.innerHTML = `<h1>🚦 Yo'l qoidasi</h1><p>Bu ilovani Telegram bot orqali oching.</p>`; return; }
  try { ME = await api("/api/me"); const d = await api("/api/questions"); QS = d.questions; TOTAL = d.total; home(); }
  catch (e) { app.innerHTML = `<h1>Xatolik</h1><p>Ma'lumot yuklanmadi. Botni qayta oching.</p>`; }
}

function home() {
  app.innerHTML = `
    <h1>🚦 Yo'l qoidasi</h1>
    <p class="slogan">Biz bilan osonroq</p>
    <p>Salom, ${ME.name ? `<span class="noalif">${esc(ME.name)}</span>` : "do'st"}! ${ME.paid ? `<span class="badge">To'liq versiya</span>` : ""}</p>
    <div class="alif">Alifbo: <button onclick="Alif.set('yangi')" data-a="yangi">Ö ö Ş ş Ç ç Ğ ğ</button><button onclick="Alif.set('eski')" data-a="eski">O' o' Sh sh Ch ch G' g'</button></div>
    <button class="tile" onclick="carSelect()"><span class="ic">🏁</span><div><b>Avtodrom</b>
      <span>3D: "B" toifaning 12 ta rasmiy mashqi</span></div></button>
    <button class="tile" onclick="Vz.open()"><span class="ic">🎬</span><div><b>Vaziyatli savollar (3D)</b>
      <span>Kim birinchi o'tadi? Xato javobda — to'qnashuv</span></div></button>
    <button class="tile" onclick="Test.start('practice')"><span class="ic">📘</span><div><b>Mashq testi</b>
      <span>${QS.length} ta savol${QS.length > 20 ? `, ${new Set(QS.map(q => q.t)).size} ta mavzu` : ""}, izoh va YHQ matni bilan</span></div></button>
    <button class="tile" onclick="${ME.paid ? "Test.start('exam')" : "buy()"}"><span class="ic">⏱</span><div><b>Imtihon ${ME.paid ? "" : "🔒"}</b>
      <span>20 ta savol, 25 daqiqa, 2 tagacha xato</span></div></button>
    <div class="stats">
      <div class="stat"><b>${ME.best_test || 0}/20</b>eng yaxshi test</div>
      <div class="stat"><b>${ME.best_drive ? ME.best_drive + " s" : "—"}</b>eng tez avtodrom</div>
    </div>
    ${ME.paid ? "" : `<p>Bepul: ${QS.length} ta savol va avtodrom. To'liq versiyada — barcha ${TOTAL} savol va imtihon.</p>
      <button class="btn" onclick="buy()">⭐ To'liq versiyani ochish</button>`}`;
}

async function buy() {
  try {
    const { link } = await api("/api/invoice", {});
    tg.openInvoice(link, async st => { if (st !== "paid") return;
      for (let i = 0; i < 8 && !(ME && ME.paid); i++) { await new Promise(r => setTimeout(r, 800)); try { ME = await api("/api/me"); } catch (e) {} }
      await load(); tg.showAlert("To'liq versiya ochildi! 🎉"); });
  } catch (e) { tg ? tg.showAlert("To'lovni ochib bo'lmadi. Botdagi tugmadan foydalaning.") : alert("Xatolik"); }
}

// ================= TEST =================
const SIGN = {
  stop: `<svg viewBox="0 0 100 100"><polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#d32f2f" stroke="#fff" stroke-width="4"/><text x="50" y="60" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial">STOP</text></svg>`,
  giveway: `<svg viewBox="0 0 100 100"><polygon points="4,8 96,8 50,92" fill="#d32f2f"/><polygon points="20,18 80,18 50,72" fill="#fff"/></svg>`,
  noentry: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#d32f2f"/><rect x="18" y="41" width="64" height="18" fill="#fff"/></svg>`,
  warning: `<svg viewBox="0 0 100 100"><polygon points="50,6 96,90 4,90" fill="#d32f2f"/><polygon points="50,24 82,82 18,82" fill="#fff"/><rect x="46" y="40" width="8" height="24" fill="#111"/><rect x="46" y="68" width="8" height="8" fill="#111"/></svg>`,
  straight: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1565c0"/><polygon points="50,18 72,44 58,44 58,82 42,82 42,44 28,44" fill="#fff"/></svg>`,
  crossing: `<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="6" fill="#1565c0"/><polygon points="50,14 88,84 12,84" fill="#fff"/><circle cx="52" cy="40" r="5" fill="#111"/><path d="M50 47 L46 62 L40 74 M47 60 L56 74 M49 50 L58 56 M48 51 L40 57" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
  redlight: `<svg viewBox="0 0 100 100"><rect x="30" y="4" width="40" height="92" rx="10" fill="#263238"/><circle cx="50" cy="22" r="11" fill="#ff3b30"/><circle cx="50" cy="50" r="11" fill="#55606a"/><circle cx="50" cy="78" r="11" fill="#55606a"/></svg>`,
  yellow: `<svg viewBox="0 0 100 100"><rect x="30" y="4" width="40" height="92" rx="10" fill="#263238"/><circle cx="50" cy="22" r="11" fill="#55606a"/><circle cx="50" cy="50" r="11" fill="#ffcc00"/><circle cx="50" cy="78" r="11" fill="#55606a"/></svg>`,
  rail: `<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="6" fill="#fff" stroke="#d32f2f" stroke-width="6"/><circle cx="32" cy="50" r="14" fill="#d32f2f"/><circle cx="68" cy="50" r="14" fill="#d32f2f"/></svg>`,
  solid: `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#555b63"/><rect x="47" y="0" width="6" height="100" fill="#fff"/></svg>`,
  dashed: `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#555b63"/><rect x="47" y="4" width="6" height="22" fill="#fff"/><rect x="47" y="40" width="6" height="22" fill="#fff"/><rect x="47" y="76" width="6" height="22" fill="#fff"/></svg>`,
};
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

const esc = v => String(v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Test = {
  st: null, timer: null, T: [],
  // mashq: mavzu tanlanadi, har safar 20 ta savol; imtihon: barcha savollardan tasodifiy 20 ta
  start(mode, topic) {
    if (mode === "practice" && topic === undefined && QS.length > 20) return this.topics();
    const pool = topic ? QS.filter(q => q.t === topic) : QS;
    const list = mode === "exam" ? shuffle(QS).slice(0, 20) : shuffle(pool).slice(0, 20);
    this.st = { mode, topic, list, i: 0, ok: 0, err: 0, done: false, end: Date.now() + 25 * 60000 };
    clearInterval(this.timer);
    if (mode === "exam") this.timer = setInterval(() => this.tick(), 1000);
    this.render();
  },
  topics() {
    const m = new Map(); QS.forEach(q => m.set(q.t, (m.get(q.t) || 0) + 1));
    const items = [...m].sort((a, b) => b[1] - a[1]); this.T = items.map(x => x[0]);
    app.innerHTML = `<h1>📘 Mashq testi</h1>
      <p>Mavzuni tanlang. Har safar 20 ta savol tasodifiy tartibda beriladi, har biriga izoh va YHQ'dagi asl matn ko'rsatiladi.</p>
      <button class="tile" onclick="Test.start('practice', '')"><span class="ic">🔀</span><div><b>Aralash — barcha mavzular</b><span>${QS.length} ta savol</span></div></button>
      ${items.map(([t, n], i) => `<button class="opt" onclick="Test.start('practice', Test.T[${i}])">${esc(t)} <small style="opacity:.6">· ${n} ta</small></button>`).join("")}
      <button class="btn ghost" onclick="home()">Orqaga</button>`;
  },
  again() { const s = this.st; this.start(s.mode, s.mode === "practice" ? (s.topic || "") : undefined); },
  tick() {
    const left = Math.max(0, this.st.end - Date.now()), el = document.getElementById("time");
    if (el) el.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
    if (left === 0) this.finish("Vaqt tugadi");
  },
  render() {
    const s = this.st, q = s.list[s.i];
    app.innerHTML = `
      <div class="top"><span>${s.i + 1} / ${s.list.length}</span>
        <span>${s.mode === "exam" ? `⏱ <b id="time"></b> · ❌ ${s.err}/2` : `✅ ${s.ok} · ❌ ${s.err}`}</span></div>
      <div class="bar"><i style="width:${s.i / s.list.length * 100}%"></i></div>
      ${q.s ? `<div class="sign">${SIGN[q.s] || ""}</div>` : ""}
      ${q.im && window.ROADSIGN ? `<div class="qimg noalif">${q.im.map(k => (k[0] === "S" ? ROADSIGN : ROADMARK)(k.slice(2)) || "").join("")}</div>` : ""}
      ${s.topic ? `<p style="margin:0">${esc(s.topic)}</p>` : ""}
      <h2>${esc(q.q)}</h2>
      ${q.o.map((t, k) => { const c = q.oi && window.ROADSIGN && (t.match(/[1-7]\.\d{1,2}(\.\d{1,2})?/) || [])[0];
        return `<button class="opt${c ? " withimg" : ""}" onclick="Test.answer(${k})">${c ? `<span class="oimg noalif">${ROADSIGN(c) || ""}</span>` : ""}<span>${esc(t)}</span></button>`; }).join("")}
      <div id="after"></div>
      <button class="btn ghost" onclick="Test.quit()">Chiqish</button>`;
    if (s.mode === "exam") this.tick();
  },
  answer(k) {
    const s = this.st, q = s.list[s.i], b = document.querySelectorAll(".opt");
    if (b[0].disabled) return;
    b.forEach(x => x.disabled = true); b[q.a].classList.add("ok");
    if (k === q.a) s.ok++; else { s.err++; b[k].classList.add("bad"); }
    tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(k === q.a ? "success" : "error");
    if (s.mode === "exam" && s.err > 2) return setTimeout(() => this.finish("2 tadan ko'p xato"), 800);
    const last = s.i === s.list.length - 1;
    document.getElementById("after").innerHTML = (s.mode === "practice" ? `<div class="explain">💡 ${esc(q.e)}${window.RULE_ANIM ? (a => a ? `<div class="anim">${a}</div>` : "")(RULE_ANIM(q.src, q.t)) : ""}${q.iq ? `<div class="quote">📜 YHQ: «${esc(q.iq)}»</div>` : ""}${q.src ? `<small>📖 Manba: YHQ, ${esc(q.src)}</small>` : ""}</div>` : "") +
      `<button class="btn" onclick="Test.next()">${last ? "Natija" : "Keyingisi →"}</button>`;
  },
  next() { const s = this.st; if (s.i === s.list.length - 1) return this.finish(); s.i++; this.render(); },
  quit() { clearInterval(this.timer); home(); },
  async finish(reason) {
    const s = this.st; if (s.done) return; s.done = true; clearInterval(this.timer);
    const exam = s.mode === "exam", pass = exam && !reason && s.err <= 2;
    if (exam) { try { ME = await api("/api/result", { kind: "test", score: s.ok }); } catch (e) {} }
    app.innerHTML = `
      <h1>${exam ? (pass ? "🎉 Imtihondan o'tdingiz!" : "😕 O'ta olmadingiz") : "Mashq tugadi"}</h1>
      ${reason ? `<p>Sabab: ${reason}</p>` : ""}
      <div class="big">${s.ok} / ${s.list.length}</div>
      <div class="stats"><div class="stat"><b>${s.ok}</b>to'g'ri</div><div class="stat"><b>${s.err}</b>xato</div></div>
      <button class="btn" onclick="Test.again()">Qaytadan</button>
      <button class="btn ghost" onclick="home()">Bosh sahifa</button>`;
  },
};

// boshqaruv: rul (aylantirish), pedallar (bosish kuchi — barmoq qanchalik pastda), uzatma, povorotnik, signal
{ // spidometr shkalasi
  let t = ""; for (let v = 0; v <= 100; v += 10) { const a = (-120 + v * 2.4 - 90) * Math.PI / 180, r1 = v % 20 ? 46 : 42;
    t += `<line x1="${60 + r1 * Math.cos(a)}" y1="${60 + r1 * Math.sin(a)}" x2="${60 + 52 * Math.cos(a)}" y2="${60 + 52 * Math.sin(a)}" stroke="#ccc" stroke-width="${v % 20 ? 1 : 2}"/>`;
    if (v % 20 === 0) t += `<text x="${60 + 33 * Math.cos(a)}" y="${63 + 33 * Math.sin(a)}" fill="#ccc" font-size="9" text-anchor="middle">${v}</text>`; }
  document.getElementById("ticks").innerHTML = t;
}
{ const box = document.getElementById("wheelBox"); let last = null;
  const ang = e => { const r = box.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
  box.addEventListener("pointerdown", e => { e.preventDefault(); box.setPointerCapture(e.pointerId); last = ang(e); Drive.ctl.touch = true; });
  box.addEventListener("pointermove", e => { if (last === null) return; const a = ang(e); let d = a - last; if (d > 180) d -= 360; if (d < -180) d += 360;
    last = a; Drive.ctl.wheel = Math.max(-540, Math.min(540, Drive.ctl.wheel + d)); });
  const up = () => { last = null; Drive.ctl.touch = false; };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
}
for (const [id, key] of [["pBrake", "brake"], ["pGas", "gas"]]) {
  const p = document.getElementById(id);
  const set = e => { const r = p.getBoundingClientRect(); Drive.ctl[key] = Math.max(0.25, Math.min(1, 0.25 + (e.clientY - r.top) / r.height * 0.9)); };
  p.addEventListener("pointerdown", e => { e.preventDefault(); p.setPointerCapture(e.pointerId); set(e); p.classList.add("on"); });
  p.addEventListener("pointermove", e => { if (Drive.ctl[key] > 0) set(e); });
  const off = () => { Drive.ctl[key] = 0; p.classList.remove("on"); };
  p.addEventListener("pointerup", off); p.addEventListener("pointercancel", off);
}
document.querySelectorAll("#gearbox button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); Drive.setGear(b.dataset.g); }));
{ const h = document.getElementById("bHorn");
  h.addEventListener("pointerdown", e => { e.preventDefault(); Drive.horn(true); }); h.addEventListener("pointerup", () => Drive.horn(false)); h.addEventListener("pointercancel", () => Drive.horn(false)); }
// klaviatura: ↑ gaz, ↓/probel tormoz, ← → rul, P R N D uzatma, Q/E povorotnik, H signal, C kamera
const KEYS = { ArrowLeft: "left", ArrowRight: "right" };
addEventListener("keydown", e => {
  if (!Drive.run) return;
  if (KEYS[e.key]) Drive.keys[KEYS[e.key]] = true;
  else if (e.key === "ArrowUp") Drive.ctl.gas = 1;
  else if (e.key === "ArrowDown" || e.key === " ") Drive.ctl.brake = 1;
  else if ("prndPRND".includes(e.key) && e.key.length === 1) Drive.setGear(e.key.toUpperCase());
  else if (e.key === "q" || e.key === "e") { if (!e.repeat) Drive.signal(e.key === "q" ? "L" : "R"); }
  else if (e.key === "h") Drive.horn(true);
  else if (e.key === "b" && !e.repeat) Drive.belt();
  else if (e.key === "c" && !e.repeat) Drive.toggleCam();
});
addEventListener("keyup", e => {
  if (KEYS[e.key]) Drive.keys[KEYS[e.key]] = false;
  else if (e.key === "ArrowUp") Drive.ctl.gas = 0;
  else if (e.key === "ArrowDown" || e.key === " ") Drive.ctl.brake = 0;
  else if (e.key === "h") Drive.horn(false);
});

// ---------- ALIFBO: yangi (ö, ğ, ş, ç) yoki amaldagi (o', g', sh, ch) ----------
// Matn bazada amaldagi alifboda saqlanadi; "yangi" tanlansa, ekrandagi barcha matn shu zahoti almashtiriladi.
const Alif = {
  mode: (() => { try { return localStorage.getItem("alif") || "yangi"; } catch (e) { return "yangi"; } })(),
  conv(t) {
    return t.replace(/O[ʻ‘’']/g, "Ö").replace(/o[ʻ‘’']/g, "ö").replace(/G[ʻ‘’']/g, "Ğ").replace(/g[ʻ‘’']/g, "ğ")
      .replace(/SH/g, "Ş").replace(/S[hH]/g, "Ş").replace(/sh/g, "ş").replace(/CH/g, "Ç").replace(/C[hH]/g, "Ç").replace(/ch/g, "ç");
  },
  skip(n) { for (let e = n.parentElement; e; e = e.parentElement) if (e.classList?.contains("noalif") || e.tagName === "SCRIPT" || e.tagName === "STYLE" || e.closest?.(".alif")) return true; return false; },
  walk(root) {
    if (this.mode !== "yangi" || !root) return;
    if (root.nodeType === 3) { if (!this.skip(root)) { const v = this.conv(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; } return; }
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) { if (this.skip(n)) continue; const v = this.conv(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  },
  set(m) { this.mode = m; try { localStorage.setItem("alif", m); } catch (e) {} this.mark(); if (m === "yangi") this.walk(document.body); else if (ME) home(); },
  mark() { document.querySelectorAll(".alif button").forEach(b => b.classList.toggle("on", b.dataset.a === this.mode)); },
};
new MutationObserver(ms => { for (const m of ms) { if (m.type === "characterData") Alif.walk(m.target); else m.addedNodes.forEach(n => Alif.walk(n)); } Alif.mark(); })
  .observe(document.body, { childList: true, subtree: true, characterData: true });
